# Tiny Tapeout project information
project:
  title:        "Protocol Chameleon"
  author:       "FoRG"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Runtime-programmable serial peripheral emulator and autonomous protocol tester"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # UART defaults to 434 clocks per bit after reset

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "serial_config.v"
    - "protocol_engine.v"
    - "spi_target.v"
    - "trial_checker.v"
    - "transaction_observer.v"
    - "feedback_policy.v"
    - "uart_tx.v"
    - "uart_rx.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "TX_DATA0"
  ui[1]: "TX_DATA1"
  ui[2]: "TX_DATA2"
  ui[3]: "TX_DATA3"
  ui[4]: "TX_DATA4"
  ui[5]: "TX_DATA5"
  ui[6]: "TX_DATA6"
  ui[7]: "TX_DATA7"

  # Outputs
  uo[0]: "UART_TX / DRDY_A"
  uo[1]: "TX_BUSY / DRDY_B"
  uo[2]: "TX_DONE / TRIAL_RUNNING"
  uo[3]: "RX_VALID / RESULT_VALID"
  uo[4]: "RX_DATA4 / SAMPLE0 / RESULT0"
  uo[5]: "RX_DATA5 / SAMPLE1 / RESULT1"
  uo[6]: "RX_DATA6 / SAMPLE2 / RESULT2"
  uo[7]: "RX_DATA7 / SAMPLE3 / RESULT3"

  # Bidirectional pins
  uio[0]: "HOST_STROBE (input)"
  uio[1]: "UART_RX / TRIAL_CS_B_N (input)"
  uio[2]: "RX_FRAMING_ERROR / ENGINE_RUNNING (output)"
  uio[3]: "CONFIG_MODE / ENGINE_CONTROL (input)"
  uio[4]: "RX_DATA0 / P0 / SPI_CS_N / TRIAL_CS_A_N"
  uio[5]: "RX_DATA1 / P1 / SPI_SCLK"
  uio[6]: "RX_DATA2 / P2 / SPI_MOSI"
  uio[7]: "RX_DATA3 / P3 / SPI_MISO"

# Do not change!
yaml_version: 6
